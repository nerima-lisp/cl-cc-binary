# cl-cc-binary documentation — MkDocs + Material configuration.
#
# Build:   mkdocs build -f docs/mkdocs.yml --strict
# Serve:   mkdocs serve  -f docs/mkdocs.yml
#
# Run both from the repository root, not from docs/: pymdownx.snippets resolves
# base_path against the working directory, and docs/src/changelog.md pulls in
# the root CHANGELOG.md. The Nix flake (`nix build .#docs`) does the same
# offline, and `nix flake check` fails on a broken link or an unlisted page.

site_name: cl-cc-binary
site_description: >-
  Object-file emission for the cl-cc Common Lisp compiler: Mach-O, ELF, PE and
  WebAssembly module bytes.
site_author: nerima-lisp
site_url: https://nerima-lisp.github.io/cl-cc-binary/

repo_name: nerima-lisp/cl-cc-binary
repo_url: https://github.com/nerima-lisp/cl-cc-binary
edit_uri: edit/main/docs/src/

docs_dir: src

strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      # Resolved against the directory mkdocs is invoked from (the repository
      # root — see the Build/Serve commands above), so docs/src/changelog.md
      # can include the root CHANGELOG.md instead of duplicating it.
      base_path:
        - "."
      check_paths: true

# Every page under docs/src/ must appear here: --strict fails the build on an
# unlisted page. That is deliberate, so the nav cannot silently fall behind.
nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Quick Start: quick-start.md
  - Guide:
      - Core Concepts: core-concepts.md
  - Reference:
      - API Reference: api-reference.md
  - Internals:
      - Architecture: architecture.md
  - Project:
      - Development: development.md
      - Changelog: changelog.md

not_in_nav: |
  notes/

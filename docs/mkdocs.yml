# cl-cc-binary documentation — MkDocs + Material configuration.
#
# Build:   mkdocs build -f docs/mkdocs.yml --strict
# Serve:   mkdocs serve  -f docs/mkdocs.yml
#
# The Nix flake (`nix build .#docs`) does the same offline, and
# `nix flake check` fails on a broken link or an unlisted page.

site_name: cl-cc-binary
site_description: >-
  Object-file emission for the cl-cc Common Lisp compiler: Mach-O, ELF, PE and
  WebAssembly module bytes.
site_author: nerima-lisp
site_url: https://nerima-lisp.github.io/cl-cc-binary/

repo_name: nerima-lisp/cl-cc-binary
repo_url: https://github.com/nerima-lisp/cl-cc-binary
edit_uri: edit/main/docs/src/

docs_dir: src

strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# Every page under docs/src/ must appear here: --strict fails the build on an
# unlisted page. That is deliberate, so the nav cannot silently fall behind.
# docs/src/ is split into guide/ reference/ project/, with only index.md,
# getting-started.md and assets/ at the root, per the 2026-08-01 revision of
# DOCS_STANDARD.md. The Internals section is gone with it: architecture.md is
# something a reader looks an answer up in, so it lives under Reference.
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guide:
      - Core Concepts: guide/core-concepts.md
      - Examples: guide/examples.md
  - Reference:
      - API: reference/api.md
      - Architecture: reference/architecture.md
  - Project:
      - Development: project/development.md

not_in_nav: |
  notes/
